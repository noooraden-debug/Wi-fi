name: بناء تطبيق WiFi Hub

# عند كل رفع إلى main يُبنى ملف APK تلقائياً — لا يحتاج المالك أي برنامج محلي.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: بناء الإعدادات وحقن الروابط
        run: |
          node -e "const fs=require('fs');const p='config/app.json';const j=JSON.parse(fs.readFileSync(p));j.configUrl=process.env.WIFIHUB_CONFIG_URL||j.configUrl;fs.writeFileSync(p,JSON.stringify(j,null,2))"
          echo "configUrl=${{ secrets.WIFIHUB_CONFIG_URL }}" >> $GITHUB_ENV
          echo "readToken=${{ secrets.WIFIHUB_READ_TOKEN }}" >> $GITHUB_ENV
          echo "requestToken=${{ secrets.WIFIHUB_REQUEST_TOKEN }}" >> $GITHUB_ENV

      - name: بناء APK
        run: |
          chmod +x android/build.sh
          ANDROID_HOME=$ANDROID_SDK_ROOT ./android/build.sh

      - name: رفع التطبيق كملف release
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/wifihub.apk
          tag_name: app
          name: WiFi Hub
          body: |
            تطبيق WiFi Hub — حمّله وانشره للمشتركين.
            الرابط: https://github.com/${{ github.repository }}/releases/tag/app

      - uses: actions/upload-artifact@v4
        with:
          name: wifihub-apk
          path: android/dist/wifihub.apk
